services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - NLP_SERVICE_URL=${NLP_SERVICE_URL}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL}
      - MEDIA_SERVICE_URL=${MEDIA_SERVICE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
      - nlp-service
      - ocr-service


  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend


  nlp-service:
    build: ./ai-services/nlp-service
    ports:
      - "8001:8000"


  ocr-service:
    build: ./ai-services/ocr-service
    ports:
      - "8002:8000"

  media-service:
    build: ./ai-services/media-service
    ports:
      - "8003:8000"
    environment:
      - NLP_SERVICE_URL=http://nlp-service:8000/api/v1/predict

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
